kind: tool
name: list_filming_situations
type: postgres-sql
source: mcp-toolbox-db
annotations:
  readOnlyHint: true
  idempotentHint: true
description: |
  List filming situations (Basic Dance, Group Dance, Battle, Showcase, …).
  Two uses:
  - Start over or first browse: leave the video-row filters empty.
  - Available situations given current filters: pass the video_entries
    filters already chosen. Only situations that exist on matching clips
    are returned.
  Returns at most 20 rows. Pass offset 20, 40, … if the user asks for more.
scopesRequired:
  - ${SCENARIO_3_KEYCLOAK_SCOPE_READ_FILMING_SITUATIONS}
parameters:
  - name: genre_id
    type: string
    description: Optional genre_id already chosen (for example gBR).
    default: ""
    required: false
  - name: camera_position_id
    type: string
    description: Optional camera_position_id already chosen (for example c01).
    default: ""
    required: false
  - name: music_track_id
    type: string
    description: Optional music_track_id already chosen (for example mBR0).
    default: ""
    required: false
  - name: choreography_id
    type: string
    description: Optional choreography_id already chosen (for example ch01).
    default: ""
    required: false
  - name: dancer_id
    type: string
    description: Optional dancer id already chosen (for example d04).
    default: ""
    required: false
  - name: offset
    type: integer
    description: Rows to skip. 0 for the first page, 20 for the second, 40 for the third.
    default: 0
    required: false
    minValue: 0
statement: |
  SELECT DISTINCT
    fs.id,
    fs.name
  FROM filming_situations fs
  LEFT JOIN video_entries ve
    ON ve.filming_situation_id = fs.id
   AND (NULLIF($1, '') IS NULL OR ve.genre_id = $1)
   AND (NULLIF($2, '') IS NULL OR ve.camera_position_id = $2)
   AND (NULLIF($3, '') IS NULL OR ve.music_track_id = $3)
   AND (NULLIF($4, '') IS NULL OR ve.choreography_id = $4)
   AND (NULLIF($5, '') IS NULL OR ve.dancer_ids @> ARRAY[$5]::varchar[])
  WHERE (
      (
        NULLIF($1, '') IS NULL
        AND NULLIF($2, '') IS NULL
        AND NULLIF($3, '') IS NULL
        AND NULLIF($4, '') IS NULL
        AND NULLIF($5, '') IS NULL
      )
      OR ve.id IS NOT NULL
    )
  ORDER BY fs.name, fs.id
  LIMIT 20 OFFSET $6
