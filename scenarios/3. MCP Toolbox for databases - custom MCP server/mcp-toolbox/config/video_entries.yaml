kind: tool
name: list_videos_by_genre
type: postgres-sql
source: mcp-toolbox-db
annotations:
  readOnlyHint: true
  idempotentHint: true
description: |
  Fetch clips to play for a required genre_id from list_genres.
  Reads only video_entries columns (ids and video_url). No joins.
  You may later add filming_situation_id or other ids stored on the row
  (camera_position_id, music_track_id, choreography_id, dancer_id).
  Always present video_url. Returns at most 20 rows. Use offset for more pages.
parameters:
  - name: genre_id
    type: string
    description: Required genre id from list_genres (for example gBR).
  - name: filming_situation_id
    type: string
    description: Optional filming situation id from list_filming_situations. Leave empty if unset.
    default: ""
    required: false
  - name: camera_position_id
    type: string
    description: Optional camera position id from list_camera_positions.
    default: ""
    required: false
  - name: music_track_id
    type: string
    description: Optional music track id stored on video_entries (for example mBR0).
    default: ""
    required: false
  - name: choreography_id
    type: string
    description: Optional choreography id stored on video_entries (for example ch01).
    default: ""
    required: false
  - name: dancer_id
    type: string
    description: Optional dancer id that must appear in video_entries.dancer_ids (for example d04).
    default: ""
    required: false
  - name: offset
    type: integer
    description: Rows to skip. 0 for the first page, 20 for the second, 40 for the third.
    default: 0
    required: false
    minValue: 0
statement: |
  SELECT
    id,
    video_url,
    genre_id,
    filming_situation_id,
    camera_position_id,
    music_track_id,
    choreography_id,
    dancer_ids
  FROM video_entries
  WHERE genre_id = $1
    AND (NULLIF($2, '') IS NULL OR filming_situation_id = $2)
    AND (NULLIF($3, '') IS NULL OR camera_position_id = $3)
    AND (NULLIF($4, '') IS NULL OR music_track_id = $4)
    AND (NULLIF($5, '') IS NULL OR choreography_id = $5)
    AND (NULLIF($6, '') IS NULL OR dancer_ids @> ARRAY[$6]::varchar[])
  ORDER BY id
  LIMIT 20 OFFSET $7
---
