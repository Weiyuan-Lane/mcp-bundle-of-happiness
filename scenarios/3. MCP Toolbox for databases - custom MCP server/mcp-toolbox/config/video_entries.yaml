kind: tool
name: suggest_random_videos
type: postgres-sql
source: mcp-toolbox-db
annotations:
  readOnlyHint: true
  idempotentHint: false
description: |
  Return one random clip from video_entries with no filters.
  Use this only when the user wants a surprise and has not given a
  preference. If they already chose a genre, use list_videos_by_genre.
  If they chose a filming situation, use list_videos_by_filming_situation.
  Never invent a URL.
statement: |
  SELECT
    id,
    video_url,
    genre_id,
    filming_situation_id,
    camera_position_id,
    music_track_id,
    choreography_id,
    dancer_ids
  FROM video_entries
  ORDER BY random()
  LIMIT 1
