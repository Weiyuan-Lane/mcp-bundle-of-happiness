kind: tool
name: list_camera_positions
type: postgres-sql
source: mcp-toolbox-db
annotations:
  readOnlyHint: true
  idempotentHint: true
description: |
  List camera angles (front, back, side, moving).
  Two uses:
  - Start over or first browse: leave the video-row filters empty.
  - Available cameras given current filters: pass the video_entries
    filters already chosen. Only cameras that exist on matching clips
    are returned.
  Returns at most 20 rows. Pass offset 20, 40, … if the user asks for more.
scopesRequired:
  - ${SCENARIO_3_KEYCLOAK_SCOPE_READ_CAMERA_POSITIONS}
parameters:
  - name: genre_id
    type: string
    description: >
      Optional genre_id from the current video row (for example gBR).
      Leave empty to list every camera.
    default: ""
    required: false
  - name: filming_situation_id
    type: string
    description: >
      Optional filming_situation_id from the current video row (for example sBM).
      Leave empty to list every camera.
    default: ""
    required: false
  - name: music_track_id
    type: string
    description: >
      Optional music_track_id from the current video row (for example mBR0).
      Leave empty to list every camera.
    default: ""
    required: false
  - name: choreography_id
    type: string
    description: >
      Optional choreography_id from the current video row (for example ch01).
      Leave empty to list every camera.
    default: ""
    required: false
  - name: dancer_id
    type: string
    description: >
      Optional dancer id from the current video row's dancer_ids (for example d04).
      Leave empty to list every camera.
    default: ""
    required: false
  - name: type
    type: string
    description: >
      Optional camera type filter. One of front, back, side, moving.
      Leave empty to skip.
    default: ""
    required: false
  - name: offset
    type: integer
    description: Rows to skip. 0 for the first page, 20 for the second, 40 for the third.
    default: 0
    required: false
    minValue: 0
statement: |
  SELECT DISTINCT
    cp.id,
    cp.description,
    cp.type
  FROM camera_positions cp
  LEFT JOIN video_entries ve
    ON ve.camera_position_id = cp.id
   AND (NULLIF($1, '') IS NULL OR ve.genre_id = $1)
   AND (NULLIF($2, '') IS NULL OR ve.filming_situation_id = $2)
   AND (NULLIF($3, '') IS NULL OR ve.music_track_id = $3)
   AND (NULLIF($4, '') IS NULL OR ve.choreography_id = $4)
   AND (NULLIF($5, '') IS NULL OR ve.dancer_ids @> ARRAY[$5]::varchar[])
  WHERE (NULLIF($6, '') IS NULL OR cp.type::text = $6)
    AND (
      (
        NULLIF($1, '') IS NULL
        AND NULLIF($2, '') IS NULL
        AND NULLIF($3, '') IS NULL
        AND NULLIF($4, '') IS NULL
        AND NULLIF($5, '') IS NULL
      )
      OR ve.id IS NOT NULL
    )
  ORDER BY cp.id
  LIMIT 20 OFFSET $7
