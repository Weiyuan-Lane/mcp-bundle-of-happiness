[project]
name = "mcp_exchange_rate_server"
version = "0.1.0"
description = "A MCP compliant exchange rate server"
authors = [
    {name = "Weiyuan Liu"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
