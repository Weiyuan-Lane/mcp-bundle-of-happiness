services:
  adk-ui:
    container_name: adk-ui
    build:
      context: .
      dockerfile: adk-ui/Dockerfile.adk
    env_file:
      - .env
    environment:
      PORT: ${ADK_UI_PORT}
      AGENTS_DIR: /app/agents
    working_dir: /app
    volumes:
      - ./adk-ui/node_modules:/app/node_modules
      - ./adk-ui/custom.css:/usr/local/lib/python3.14/site-packages/google/adk/cli/browser/custom.css:ro
      # Agents
      - ./scenarios/0. Simple MCP client and server setup:/app/agents/scenario_0__simple_mcp_setup
      - ./scenarios/1. Managed MCP client setup and server connections:/app/agents/scenario_1__managed_mcp_setup
      - ./scenarios/2. Custom self-managed MCP servers:/app/agents/scenario_2__custom_self_managed_mcp_servers
      - ./scenarios/3. MCP Toolbox for databases - custom MCP server:/app/agents/scenario_3__mcp_toolbox_for_databases
      - ./scenarios/X. MCP Sandwich - WebMCP and ChromeDevTools MCP:/app/agents/scenario_x__mcp_sandwich
    ports:
      - "127.0.0.1:${ADK_UI_PORT}:${ADK_UI_PORT}"
    extra_hosts:
      - "chrome.localhost:host-gateway" # Note - chrome.localhost is needed for reachability as any other hostname is considered as untrusted. Only "*.localhost" will work - https://chromium.googlesource.com/chromium/src/+/HEAD/net/base/url_util.cc#47
    depends_on:
      - demo-keycloak
      - demo-mcp-toolbox

  #############################################################################
  # Custom MCP Servers                                                        #
  #############################################################################
  mcp-server-exchange-rate:
    container_name: mcp-server-exchange-rate
    build:
      context: scenarios/2. Custom self-managed MCP servers/mcp-servers/exchange-rate
      dockerfile: ops/Dockerfile.dev
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./scenarios/2. Custom self-managed MCP servers/mcp-servers/exchange-rate:/app
    ports:
      - "127.0.0.1:${SCENARIO_2_MCP_SERVER_EXCHANGE_RATE_PORT}:${SCENARIO_2_MCP_SERVER_EXCHANGE_RATE_PORT}"
    depends_on:
      - demo-keycloak

  mcp-server-quickchart:
    container_name: mcp-server-quickchart
    build:
      context: scenarios/2. Custom self-managed MCP servers/mcp-servers/quickchart
      dockerfile: ops/Dockerfile.dev
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./scenarios/2. Custom self-managed MCP servers/mcp-servers/quickchart:/app
    ports:
      - "127.0.0.1:${SCENARIO_2_MCP_SERVER_QUICKCHART_PORT}:${SCENARIO_2_MCP_SERVER_QUICKCHART_PORT}"
    depends_on:
      - demo-keycloak

  #############################################################################
  # Other demo servers                                                        #
  #############################################################################
  demo-webmcp-server:
    container_name: demo-webmcp-server
    build:
      context: scenarios/X. MCP Sandwich - WebMCP and ChromeDevTools MCP/google-web-26-demos
      dockerfile: ops/Dockerfile.dev
    environment:
      PORT: ${SCENARIO_X_WEB_SERVER_PORT}
    working_dir: /app
    volumes:
      - "./scenarios/X. MCP Sandwich - WebMCP and ChromeDevTools MCP/google-web-26-demos:/app"
    ports:
      - "127.0.0.1:${SCENARIO_X_WEB_SERVER_PORT}:${SCENARIO_X_WEB_SERVER_PORT}"

  # Identity / OAuth
  demo-keycloak:
    container_name: demo-keycloak
    build:
      context: keycloak
      dockerfile: Dockerfile.dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: ${KEYCLOAK_PORT}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/.data:/opt/keycloak/data
      - ./keycloak/import:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT}:${KEYCLOAK_PORT}"

  # MCP Toolbox for databases
  demo-mcp-toolbox:
    container_name: demo-mcp-toolbox
    platform: linux/amd64
    build:
      context: scenarios/3. MCP Toolbox for databases - custom MCP server/mcp-toolbox
      dockerfile: Dockerfile
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./scenarios/3. MCP Toolbox for databases - custom MCP server/mcp-toolbox/config:/app/config
    ports:
      - "127.0.0.1:${SCENARIO_3_MCP_TOOLBOX_PORT}:${SCENARIO_3_MCP_TOOLBOX_PORT}"
      - "127.0.0.1:${SCENARIO_3_MCP_TOOLBOX_UI_PORT}:${SCENARIO_3_MCP_TOOLBOX_UI_PORT}"

  # Database for MCP Toolbox
  demo-mcp-toolbox-database:
    image: postgres:18.6-alpine3.24
    container_name: demo-mcp-toolbox-database
    env_file:
      - .env
    environment:
      - POSTGRES_PASSWORD=${SCENARIO_3_MCP_TOOLBOX_DATABASE_PASSWORD}
      - POSTGRES_DB=${SCENARIO_3_MCP_TOOLBOX_DATABASE_NAME}
      - PGPORT=${SCENARIO_3_MCP_TOOLBOX_DATABASE_PORT}
    volumes:
      - ./scenarios/3. MCP Toolbox for databases - custom MCP server/mcp-toolbox-database-local-cache:/var/lib/postgresql
      - ./scenarios/3. MCP Toolbox for databases - custom MCP server/mcp-toolbox/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${SCENARIO_3_MCP_TOOLBOX_DATABASE_PORT}:${SCENARIO_3_MCP_TOOLBOX_DATABASE_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
